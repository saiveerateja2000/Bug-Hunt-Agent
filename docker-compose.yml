services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: app
    env_file:
      - .env
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    volumes:
      - ./data/evidence:/data/evidence
      - ./data/reports:/data/reports
      - ./data/logs:/data/logs
      - ./data/backups:/data/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    volumes:
      - ./data/evidence:/data/evidence
      - ./data/reports:/data/reports
      - ./data/logs:/data/logs
      - ./data/backups:/data/backups
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bughunt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bughunt}
      POSTGRES_DB: ${POSTGRES_DB:-bughunt}
    networks:
      - private
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bughunt} -d ${POSTGRES_DB:-bughunt}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

networks:
  private:
    driver: bridge
